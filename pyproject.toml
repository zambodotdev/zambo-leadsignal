[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zambo-leadsignal"
version = "1.0.0"
description = "Run a lead signal sweep for a local trade market on Zambo: live signals, screened input, continuity-checked, brief written, every step on a verifiable AER-1 receipt."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Brennan Zambo", email = "brennanzambo@zambo.dev" }
]
keywords = ["ai-agents", "mcp", "model-context-protocol", "handover", "receipts", "zambo", "aer-1"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://zambo.dev"
"Get started" = "https://zambo.dev/add/"
Guide = "https://rambozambodotdev.gitlab.io/aer1-hub/handover-graph.html"
Repository = "https://github.com/zambodotdev/zambo-leadsignal"

[project.scripts]
zambo-leadsignal = "zambo_leadsignal.cli:main"

[tool.setuptools]
packages = ["zambo_leadsignal"]

[tool.setuptools.package-data]
zambo_leadsignal = ["SKILL.md"]
